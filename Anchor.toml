[toolchain]
anchor_version = "0.31.1"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
rodeo_core = "EkEPd5wXSi3NQUHewx64cP27tDQ6uTcK5poG6AuWmy8Z"
rodeo_market = "9vhrgTdridvE1uuxPenqDW9RVKdu3A5Dc2DzKVbaew8n"
rodeo_router = "CFQUWHE88YWrtnu9yADgEAB1MrPAYvdAjUbRwbTLafxD"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
upgradeable = true
# DIAGNOSTIC ONLY (debug/toolchain-isolation branch): the previous run
# failed with "Test validator does not look started" under Solana CLI
# 2.2.20's solana-test-validator; increase the startup wait in case it is
# simply slower to start than Anchor's default, before concluding this is
# a real crash.
startup_wait = 20000

[scripts]
test = "pnpm --filter @rodeo/integration test"
