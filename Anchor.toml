[toolchain]
anchor_version = "0.31.1"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

# Canonical rodeo_core program id for this repository/branch (PR #19).
[programs.localnet]
rodeo_core = "EkEPd5wXSi3NQUHewx64cP27tDQ6uTcK5poG6AuWmy8Z"
rodeo_market = "9vhrgTdridvE1uuxPenqDW9RVKdu3A5Dc2DzKVbaew8n"
rodeo_router = "CFQUWHE88YWrtnu9yADgEAB1MrPAYvdAjUbRwbTLafxD"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "sh -c 'if [ \"$RODEO_TEST_SUITE\" = \"benchmark\" ]; then pnpm --filter @rodeo/integration exec vitest run localnet-settle-reveal-benchmark.test.ts; elif [ \"$RODEO_TEST_SUITE\" = \"heap\" ]; then pnpm --filter @rodeo/integration exec vitest run localnet-heap-diagnostic.test.ts; else pnpm --filter @rodeo/integration test; fi'"

[test]
startup_wait = 20000
shutdown_wait = 2000
upgradeable = true

[[test.genesis]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
program = "vendor/mpl-core/mpl_core_program.so"
