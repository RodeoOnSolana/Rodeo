[toolchain]
anchor_version = "0.31.1"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
rodeo_core = "EkEPd5wXSi3NQUHewx64cP27tDQ6uTcK5poG6AuWmy8Z"
rodeo_market = "9vhrgTdridvE1uuxPenqDW9RVKdu3A5Dc2DzKVbaew8n"
rodeo_router = "CFQUWHE88YWrtnu9yADgEAB1MrPAYvdAjUbRwbTLafxD"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
upgradeable = true
# solana-test-validator 2.2.20 needs more than Anchor's default startup
# wait on the CI runner; without this, `anchor test` can report "Test
# validator does not look started" even though the validator is merely
# slow to come up, not actually failing.
startup_wait = 20000

[scripts]
test = "pnpm --filter @rodeo/integration test"
