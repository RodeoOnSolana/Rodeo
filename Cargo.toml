[workspace]
members = [
    "programs/rodeo_core",
    "programs/rodeo_market",
    "programs/rodeo_router",
]
resolver = "2"

[workspace.package]
rust-version = "1.79"

# Pins the platform-tools (SBF Rust/LLVM toolchain) version `cargo-build-sbf`
# downloads and uses, independent of the installed Solana/Agave CLI's
# built-in default. platform-tools v1.52 bundles Rust 1.89.0, which
# supports the `edition2024` Cargo feature; the CLI-bundled default at
# Solana CLI 2.2.20 (v1.48, Rust 1.84.0) does not, and started failing
# `anchor build` once mpl-core 0.11.2's dependency graph (via the required
# solana-program/solana-zk-sdk 2.2.1 bump) pulled in transitive crates
# whose latest patch releases require edition2024. v1.50/v1.51 were tried
# first and still bundle Rust 1.84.x; v1.52 is the oldest release
# confirmed to bundle Rust >= 1.85 (edition2024 was stabilized in Rust
# 1.85.0). This bump also surfaced (and was fixed on main by boxing
# SettleUnstake's SPL accounts) a pre-existing SBF stack-frame overflow in
# `SettleUnstake::try_accounts` that the older toolchain silently built
# without failing. See docs/mpl-core-integration-proof.md for the
# full investigation.
[workspace.metadata.solana]
tools-version = "v1.52"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Patched fork of mpl-core 0.11.2 to eliminate an SBF stack-frame overflow in
# `registry_records_to_plugin_list` (see docs/mpl-core-integration-proof.md).
# The base is the exact crates.io 0.11.2 source; the single patch commit
# refactors the `try_fold` closure into a plain `for` loop to reduce
# simultaneously-live stack. Pinned by exact SHA.
[patch.crates-io]
mpl-core = { git = "https://github.com/RodeoOnSolana/mpl-core", rev = "ef6626172f3121dfde619b45a10f887e21e7d958" }
