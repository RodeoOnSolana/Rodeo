name: Phase 0 verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: v2.2.20
  ANCHOR_VERSION: 0.31.1
  RUST_VERSION: 1.85.1
  SOLANA_INSTALL_DIR: /home/runner/.local/share/solana/install/active_release
  MPL_CORE_EXPECTED_SHA256: f03e75373ae9cae07b5875f7818c55147b73c5607ca0f96968bab93cd583dc6e

jobs:
  phase0-static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup override set "$RUST_VERSION"

      - name: Restore Rust, Anchor, and Solana toolchains
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana/install
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-solana-${{ env.SOLANA_VERSION }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Agave CLI
        run: |
          if [ ! -x "$SOLANA_INSTALL_DIR/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/$SOLANA_VERSION/install)"
          fi
          echo "$SOLANA_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          if ! command -v anchor >/dev/null || [ "$(anchor --version)" != "anchor-cli $ANCHOR_VERSION" ]; then
            cargo install anchor-cli --version "$ANCHOR_VERSION" --locked
          fi

      - name: Save Rust, Anchor, and Solana toolchains
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana/install
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Report toolchain
        run: |
          rustc --version
          cargo --version
          solana --version
          solana-test-validator --version
          anchor --version
          node --version
          pnpm --version
          cargo build-sbf --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm build

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: TypeScript tests
        run: pnpm test

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Adapt upstream lock to Rodeo workspace
        run: cargo metadata --format-version 1 > /dev/null

      - name: Rust checks
        run: cargo check --workspace --all-targets --locked

      - name: Rust unit tests
        run: cargo test -p rodeo_core --locked

      - name: Rust unit tests (test-fixtures)
        run: cargo test -p rodeo_core --locked --features test-fixtures

      - name: MPL Core semantic parity unit tests
        run: |
          git clone -b mpl-core-0.11.2-patched --depth 1 https://github.com/RodeoOnSolana/mpl-core /tmp/mpl-core
          cargo test --manifest-path /tmp/mpl-core/Cargo.toml --lib

      - name: Anchor build
        run: |
          chmod +x scripts/check-sbf-stack-safety.sh
          scripts/check-sbf-stack-safety.sh anchor build

      - name: Generate SDK from IDLs
        run: pnpm sdk:generate

      - name: Validate SDK and program IDs
        run: |
          pnpm sdk:validate
          pnpm build

      - name: Upload generated verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-generated-artifacts
          path: |
            Cargo.lock
            target/idl/*.json
            packages/sdk/src/generated/*.ts

      - name: Verify Metaplex Core program binary
        run: |
          chmod +x scripts/verify-mpl-core-program.sh
          MPL_CORE_EXPECTED_SHA256="${MPL_CORE_EXPECTED_SHA256:-}" scripts/verify-mpl-core-program.sh

      - name: Upload Metaplex Core program binary provenance
        uses: actions/upload-artifact@v4
        with:
          name: mpl-core-program-provenance
          path: |
            vendor/mpl-core/mpl_core_program.so.sha256

  phase0-epoch:
    name: epoch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup override set "$RUST_VERSION"

      - name: Restore Rust, Anchor, and Solana toolchains
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana/install
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-solana-${{ env.SOLANA_VERSION }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Agave CLI
        run: |
          if [ ! -x "$SOLANA_INSTALL_DIR/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/$SOLANA_VERSION/install)"
          fi
          echo "$SOLANA_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          if ! command -v anchor >/dev/null || [ "$(anchor --version)" != "anchor-cli $ANCHOR_VERSION" ]; then
            cargo install anchor-cli --version "$ANCHOR_VERSION" --locked
          fi

      - name: Save Rust, Anchor, and Solana toolchains
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana/install
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Report toolchain
        run: |
          rustc --version
          cargo --version
          solana --version
          solana-test-validator --version
          anchor --version
          node --version
          pnpm --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm build

      - name: Verify Metaplex Core program binary
        run: |
          chmod +x scripts/verify-mpl-core-program.sh
          MPL_CORE_EXPECTED_SHA256="${MPL_CORE_EXPECTED_SHA256:-}" scripts/verify-mpl-core-program.sh

      - name: Configure local validator wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
          solana config set --url localhost

      - name: Build auxiliary test program binaries
        run: |
          scripts/check-sbf-stack-safety.sh anchor build --program-name rodeo_market
          scripts/check-sbf-stack-safety.sh anchor build --program-name rodeo_router

      - name: Build epoch-profile test program binary
        run: scripts/check-sbf-stack-safety.sh anchor build --program-name rodeo_core -- --features mock-randomness,test-short-timeout,test-short-epoch,test-short-claim-cooldown,test-fixtures

      - name: Anchor localnet integration tests (epoch profile)
        id: epoch-suite
        timeout-minutes: 45
        run: |
          set -u -o pipefail
          set +e
          chmod +x scripts/ci-localnet-health.sh
          scripts/ci-localnet-health.sh "http://127.0.0.1:8899" /tmp/phase0-epoch-health.log .anchor/test-ledger &
          HEALTH_PID=$!
          RODEO_TEST_SUITE=epoch anchor test --skip-build --no-idl 2>&1 | tee /tmp/phase0-epoch.log
          TEST_EXIT=${PIPESTATUS[0]}
          kill $HEALTH_PID 2>/dev/null || true
          wait $HEALTH_PID 2>/dev/null || true
          mkdir -p phase0-epoch-logs
          cp /tmp/phase0-epoch*.log .anchor/test-ledger/test-ledger-log.txt phase0-epoch-logs/ 2>/dev/null || true
          exit $TEST_EXIT

      - name: Upload epoch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-epoch-logs-${{ github.sha }}
          path: phase0-epoch-logs/
          if-no-files-found: warn

      - name: Ensure no stray validator process survives
        if: always()
        run: |
          pkill -f solana-test-validator || true
          sleep 2

  phase0-claim:
    name: claim
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup override set "$RUST_VERSION"

      - name: Restore Rust, Anchor, and Solana toolchains
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana/install
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-solana-${{ env.SOLANA_VERSION }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Agave CLI
        run: |
          if [ ! -x "$SOLANA_INSTALL_DIR/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/$SOLANA_VERSION/install)"
          fi
          echo "$SOLANA_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          if ! command -v anchor >/dev/null || [ "$(anchor --version)" != "anchor-cli $ANCHOR_VERSION" ]; then
            cargo install anchor-cli --version "$ANCHOR_VERSION" --locked
          fi

      - name: Save Rust, Anchor, and Solana toolchains
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana/install
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Report toolchain
        run: |
          rustc --version
          cargo --version
          solana --version
          solana-test-validator --version
          anchor --version
          node --version
          pnpm --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm build

      - name: Verify Metaplex Core program binary
        run: |
          chmod +x scripts/verify-mpl-core-program.sh
          MPL_CORE_EXPECTED_SHA256="${MPL_CORE_EXPECTED_SHA256:-}" scripts/verify-mpl-core-program.sh

      - name: Configure local validator wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
          solana config set --url localhost

      - name: Build auxiliary test program binaries
        run: |
          scripts/check-sbf-stack-safety.sh anchor build --program-name rodeo_market
          scripts/check-sbf-stack-safety.sh anchor build --program-name rodeo_router

      - name: Build claim-profile test program binary
        run: scripts/check-sbf-stack-safety.sh anchor build --program-name rodeo_core -- --features mock-randomness,test-short-timeout,test-short-claim-cooldown,test-fixtures

      - name: Anchor localnet integration tests (claim profile)
        id: claim-suite
        timeout-minutes: 45
        run: |
          set -u -o pipefail
          set +e
          chmod +x scripts/ci-localnet-health.sh
          scripts/ci-localnet-health.sh "http://127.0.0.1:8899" /tmp/phase0-claim-health.log .anchor/test-ledger &
          HEALTH_PID=$!
          RODEO_TEST_SUITE=claim anchor test --skip-build --no-idl 2>&1 | tee /tmp/phase0-claim.log
          TEST_EXIT=${PIPESTATUS[0]}
          kill $HEALTH_PID 2>/dev/null || true
          wait $HEALTH_PID 2>/dev/null || true
          mkdir -p phase0-claim-logs
          cp /tmp/phase0-claim*.log .anchor/test-ledger/test-ledger-log.txt phase0-claim-logs/ 2>/dev/null || true
          exit $TEST_EXIT

      - name: Upload claim logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-claim-logs-${{ github.sha }}
          path: phase0-claim-logs/
          if-no-files-found: warn

      - name: Ensure no stray validator process survives
        if: always()
        run: |
          pkill -f solana-test-validator || true
          sleep 2

  verify:
    name: verify
    runs-on: ubuntu-24.04
    needs: [phase0-static, phase0-epoch, phase0-claim]
    if: always()
    steps:
      - name: Phase 0 verification summary
        run: |
          if [ "${{ needs.phase0-static.result }}" != "success" ] || [ "${{ needs.phase0-epoch.result }}" != "success" ] || [ "${{ needs.phase0-claim.result }}" != "success" ]; then
            echo "::error::Phase 0 failed: static=${{ needs.phase0-static.result }}, epoch=${{ needs.phase0-epoch.result }}, claim=${{ needs.phase0-claim.result }}"
            exit 1
          fi
          echo "Phase 0 verification complete"
